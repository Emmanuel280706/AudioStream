<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioStream Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="VIEW/styles.css">
</head>
<body>

    <header class="p-3 bg-dark text-white">
        <nav class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 m-0">AudioStream Web</h1>
            <a href="https://github.com/Emmanuel280706/AudioStream" target="_blank" class="btn btn-light btn-hover">GitHub</a>
        </nav>
    </header>

    <main class="container my-4 grid-principal">

        <section class="caja p-3">
            <article class="visualizador mb-3">
                <p class="m-0">🎵 Reproduciendo</p>
            </article>

            <h2 id="titulo-cancion" class="h5">Selecciona una canción</h2>
            <p id="artista-cancion">Artista</p>

            <audio id="reproductor-audio" controls class="w-100 my-2"></audio>

            <article class="my-2">
                <label for="barra-progreso">Progreso:</label>
                <input type="range" id="barra-progreso" class="form-range" value="0" min="0" max="100">
            </article>

            <article class="my-2">
                <button id="btn-anterior" class="btn btn-secondary btn-hover">Anterior</button>
                <button id="btn-play" class="btn btn-primary btn-hover">Play / Pause</button>
                <button id="btn-siguiente" class="btn btn-secondary btn-hover">Siguiente</button>
            </article>

            <article class="my-2">
                <label for="control-volumen">Volumen:</label>
                <input type="range" id="control-volumen" class="form-range" value="100" min="0" max="100">
            </article>
        </section>

        <section class="caja p-3">
            <h2 class="h5 mb-3">Lista de 10 Canciones</h2>
            <section id="contenedor-canciones" class="row g-2">
            </section>
        </section>

    </main>

    <footer class="text-center p-3 bg-dark text-white mt-4">
        <p class="m-0">AudioStream Web - 2026</p>
    </footer>

    <script src="SRC/app.js"></script>
</body>
</html>
